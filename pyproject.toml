[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet"
version = "0.1.0"
description = "Decentralized AMR fleet coordination (MuJoCo + ZeroMQ + PIBT + learned priorities)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pyzmq>=25", "mujoco>=3.1", "torch>=2.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fleet = ["dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sim: integration test that opens the MuJoCo viewer (visual, accelerated)",
]
